name: main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  release:
    uses: avi2d/workflows/.github/workflows/release-main.yml@v3
    permissions: { contents: write, id-token: write, actions: read, pull-requests: read }
    with:
      full-test: true
